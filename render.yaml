services:
  - type: web
    name: connectx-platform
    env: node
    plan: free
    buildCommand: "npm install --include=dev && npm run build"
    startCommand: "npm run db:push && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: connectx-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://connectx-platform.onrender.com

databases:
  - name: connectx-postgres
    plan: free
    databaseName: connectx_db
    user: connectx_user
