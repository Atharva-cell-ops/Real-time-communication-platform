version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: connectx-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: connectx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectx-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/connectx_db?schema=public"
      JWT_SECRET: "connectx_super_production_secret_key_2026_xyz!"
      JWT_EXPIRES_IN: "7d"
      CLIENT_URL: "http://localhost:5000"
      MAX_FILE_SIZE_BYTES: "10485760"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads

volumes:
  pgdata:
  app-uploads:
